{% extends 'base.html' %}

{% block content %}
<div class="auth-form">
    <h2>🐝 Регистрация</h2>
    <form method="POST" action="{{ url_for('register') }}">
        <input type="text" name="username" placeholder="Имя пользователя" required>
        <div style="position:relative;">
            <input type="password" name="password" placeholder="Пароль" required id="registerPassword">
            <span onclick="togglePassword('registerPassword')" style="position:absolute; right:15px; top:12px; cursor:pointer; color:#a09070;">👁️</span>
        </div>
        <button type="submit" class="btn btn-gold">Создать аккаунт</button>
    </form>
    <p style="color:#a09070; text-align:center; margin-top:16px;">
        Уже есть? <a href="{{ url_for('login') }}" style="color:#f7b82b;">Войти</a>
    </p>
</div>

<script>
function togglePassword(id) {
    const input = document.getElementById(id);
    input.type = input.type === 'password' ? 'text' : 'password';
}
</script>
{% endblock %}
