{% extends 'base.html' %}

{% block content %}
<h2 style="color:#f7b82b;">⚙️ Админ-панель</h2>
<div class="admin-stats">
    <div class="stat-card">
        <div class="num">{{ stats.users }}</div>
        <div class="label">👥 Пользователей</div>
    </div>
    <div class="stat-card">
        <div class="num">{{ stats.banned }}</div>
        <div class="label">🚫 Забанено</div>
    </div>
    <div class="stat-card">
        <div class="num">{{ stats.orders }}</div>
        <div class="label">📦 Заказов</div>
    </div>
    <div class="stat-card">
        <div class="num">{{ stats.products }}</div>
        <div class="label">🍯 Товаров</div>
    </div>
    <div class="stat-card">
        <div class="num">{{ stats.revenue }}</div>
        <div class="label">💰 Выручка (🍯)</div>
    </div>
</div>

<div style="display:flex; gap:12px; flex-wrap:wrap; margin:16px 0;">
    <a href="{{ url_for('admin_users') }}" class="btn btn-gold">👥 Пользователи</a>
    <a href="{{ url_for('admin_products') }}" class="btn btn-gold">📦 Товары</a>
    <a href="{{ url_for('admin_orders') }}" class="btn btn-gold">📋 Заказы</a>
    <a href="{{ url_for('admin_ads') }}" class="btn btn-gold">📢 Реклама</a>
</div>
{% endblock %}
